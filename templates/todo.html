<!DOCTYPE html>
<html>
<head>
  <title>To-Do</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #4f46e5; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>To-Do Page</h2>
  <form method="POST" action="/submittodoitem">
    <label>Item Name</label>
    <input type="text" name="itemName" required>
    <label>Item Description</label>
    <textarea name="itemDescription" rows="3" required></textarea>
    <label>Item ID</label>
    <input type="text" name="itemId">
    <button type="submit">Add To-Do</button>
  </form>
</body>
</html>
