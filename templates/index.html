<!DOCTYPE html>
<html>
<head>
  <title>Submit Data</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #4f46e5; color: #fff; border: none; cursor: pointer; }
    .error { background: #fee2e2; color: #b91c1c; padding: 10px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <h2>Submit Your Details</h2>

  {% if error %}
    <div class="error">Error: {{ error }}</div>
  {% endif %}

  <form method="POST" action="/">
    <label>Name</label>
    <input type="text" name="name" value="{{ name or '' }}">
    <label>Email</label>
    <input type="email" name="email" value="{{ email or '' }}">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
